<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — WLK Tours Proposal Studio</title>
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark" style="color:var(--navy);">WLK<span>TOURS</span></div>
        <span class="brand-sub" style="color:var(--slate);">Proposal Studio</span>
      </div>
      <form id="login-form" onsubmit="return false;">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" id="login-email" required autofocus>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" id="login-password" required>
        </div>
        <div class="error-note" id="login-error" style="display:none;"></div>
        <button type="button" id="signin-btn" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;">Sign in</button>
      </form>
    </div>
  </div>

  <script src="/assets/js/helpers.js"></script>
  <script>
    async function doLogin(){
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      const btn = document.getElementById('signin-btn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try{
        await api('POST', '/api/auth/login', { email, password });
        window.location.href = '/admin';
      }catch(err){
        errEl.textContent = err.message || 'Sign in failed.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    }
    document.getElementById('signin-btn').addEventListener('click', doLogin);
    document.getElementById('login-password').addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); doLogin(); }
    });
  </script>
</body>
</html>
